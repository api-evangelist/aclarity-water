aid: aclarity-water
name: Aclarity Water
description: >-
  Aclarity, Inc. (Aclarity Water) is a Medway, Massachusetts cleantech company
  that designs and manufactures on-site PFAS destruction technology. Its flagship
  Aclarity Octa system uses electrochemical oxidation to break the carbon-fluorine
  bond in per- and polyfluoroalkyl substances (PFAS), destroying these "forever
  chemicals" at landfills, centralized waste-treatment facilities, industrial
  sites (laundry, pulp and paper, automotive), municipal and industrial
  wastewater, drinking-water treatment, and AFFF-contaminated aviation sites.
  Aclarity is a portfolio company of DCVC. It is a physical water-treatment
  hardware and services business with no public developer API surface; this
  profile is maintained in the API Evangelist network for company intelligence.
